name: Deploy admin to Cloudflare Pages (development)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment for the admin release
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

permissions:
  contents: read

jobs:
  validate:
    name: Test and build admin
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: 11.10.0
          runtime: node@22.22.2
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm run lint

      - name: Test admin
        run: pnpm exec nx test admin --skip-nx-cache

      - name: Build admin
        run: pnpm exec nx build admin --configuration production --skip-nx-cache

  release:
    name: Version admin release
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: billmesh-web-release
      cancel-in-progress: false
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare semantic version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/admin/package.json';
          const releaseType = process.env.RELEASE_TYPE;
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(manifest.version);
          if (!match || !['minor', 'major'].includes(releaseType)) {
            throw new Error('Admin version or release type is invalid.');
          }
          const current = match.slice(1).map(Number);
          const next = releaseType === 'major'
            ? [current[0] + 1, 0, 0]
            : [current[0], current[1] + 1, 0];
          manifest.version = next.join('.');
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\ntag=admin-v${manifest.version}\n`);
          NODE
      - name: Commit and tag release atomically
        id: commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/package.json
          git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          git tag --annotate "${RELEASE_TAG}" --message "${RELEASE_TAG}"
          git push --atomic origin HEAD:main "${RELEASE_TAG}"
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy admin
    needs: [validate, release]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development-admin
    concurrency:
      group: deploy-admin-development
      cancel-in-progress: false
    steps:
      - name: Check out released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.revision }}
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: 11.10.0
          runtime: node@22.22.2
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create admin runtime configuration
        env:
          AUTH_BFF_BASE_URL: ${{ vars.AUTH_BFF_BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node <<'NODE'
          const {readFileSync, writeFileSync} = require('node:fs');
          const templatePath = 'apps/admin/public/config/config.tpl.json';
          const outputPath = 'apps/admin/public/config/config.json';
          let rendered = readFileSync(templatePath, 'utf8');
          for (const name of ['AUTH_BFF_BASE_URL', 'API_BASE_URL']) {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`${name} is not configured.`);
            rendered = rendered.replaceAll(JSON.stringify(`$${name}`), JSON.stringify(value));
          }
          const unresolved = rendered.match(/\$[A-Z][A-Z0-9_]*/g);
          if (unresolved) throw new Error(`Unresolved template values: ${unresolved.join(', ')}`);
          writeFileSync(outputPath, `${JSON.stringify(JSON.parse(rendered), null, 2)}\n`);
          NODE

      - name: Build admin
        run: pnpm exec nx build admin --configuration production --skip-nx-cache

      - name: Validate deployment configuration
        env:
          CF_ADMIN_PROJECT_NAME: ${{ vars.CF_ADMIN_PROJECT_NAME }}
          ADMIN_PUBLIC_URL: ${{ vars.ADMIN_PUBLIC_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${CF_ADMIN_PROJECT_NAME}" ]]
          [[ "${ADMIN_PUBLIC_URL}" =~ ^https:// ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]]
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]]
          test -f dist/apps/admin/browser/index.html

      - name: Deploy admin to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ADMIN_PROJECT_NAME: ${{ vars.CF_ADMIN_PROJECT_NAME }}
        run: |
          pnpm dlx --allow-build=esbuild --allow-build=sharp --allow-build=workerd \
            wrangler@4.112.0 pages deploy dist/apps/admin/browser \
            --project-name "${CF_ADMIN_PROJECT_NAME}" \
            --branch main

      - name: Verify live admin
        env:
          ADMIN_PUBLIC_URL: ${{ vars.ADMIN_PUBLIC_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "${ADMIN_PUBLIC_URL}/"

      - name: Publish deployment summary
        run: |
          {
            echo '### development-admin deployment'
            echo
            echo '- Version: `${{ needs.release.outputs.tag }}`'
            echo '- Revision: `${{ needs.release.outputs.revision }}`'
            echo '- URL: `${{ vars.ADMIN_PUBLIC_URL }}`'
          } >> "${GITHUB_STEP_SUMMARY}"
